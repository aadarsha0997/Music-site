version: '3.8'

services:
  dev-db:
    image: postgres:15
    container_name: jr-dev_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  app:
    build: .                  # Dockerfile in same folder
    container_name: jr-dev_app
    ports:
      - "${APP_PORT:-3000}:3000"   # map host port 3000 to container 3000
    env_file: .env
    depends_on:
      - dev-db
